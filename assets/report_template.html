<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>disk-cleaner-plus 全盘清理报告</title>
<style>
:root{
  --page:#eef0f2;--app:#fff;--side:#fbfbfc;--soft:#f7f7f8;--ink:#111216;--muted:#5f6368;--faint:#9aa0a6;
  --line:#e8eaed;--line-strong:#dadce0;--dark:#202124;--blue:#1a73e8;--blue-soft:#e8f0fe;
  --green:#34a853;--green-soft:#e6f4ea;--yellow:#fbbc04;--yellow-soft:#fef3e8;--orange:#fa7b17;--orange-soft:#feefe3;
  --red:#ea4335;--red-soft:#fce8e6;--violet:#9334e6;--cyan:#00acc1;
  --track:#e8eaed;--shadow:0 1px 2px rgba(60,64,67,.1),0 2px 6px rgba(60,64,67,.08);
  --r:8px;--sidebar:230px;--mono:Roboto Mono,SF Mono,ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:Segoe UI,Microsoft YaHei,PingFang SC,system-ui,sans-serif;line-height:1.5}
button{font:inherit;cursor:pointer}
.app-shell{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--dark);color:#fff;display:grid;place-items:center;font-size:18px}
.brand-title{font-size:16px;font-weight:800}.brand-sub{font-size:11px;color:var(--faint)}
.nav{display:flex;flex-direction:column;gap:6px}
.nav-link{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:transparent;color:var(--ink);padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;text-align:left;transition:.15s}
.nav-link:hover{background:#fff;border-color:var(--line)}
.nav-link.active{background:#fff;border-color:var(--line);box-shadow:var(--shadow)}
.nav-link .count{margin-left:auto;background:var(--line);color:var(--muted);font:10px var(--mono);padding:2px 6px;border-radius:999px}
.main{padding:24px 28px 40px;max-width:1400px;width:100%}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}
h1{font-size:26px;font-weight:800}h2{font-size:18px;font-weight:700;margin-bottom:14px}h3{font-size:15px;font-weight:700}
.meta{color:var(--muted);font-size:13px;margin-top:4px}

/* Dashboard cards */
.grid{display:grid;gap:16px}
.cards-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cards-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cards-2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:1200px){.cards-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.cards-4,.cards-3,.cards-2{grid-template-columns:1fr}}
.card{background:var(--app);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:8px}
.card-value{font-size:28px;font-weight:800;letter-spacing:-.02em}
.card-value.blue{color:var(--blue)}.card-value.green{color:var(--green)}.card-value.orange{color:var(--orange)}.card-value.red{color:var(--red)}
.card-sub{font-size:12px;color:var(--faint);margin-top:4px}

/* Drive bars */
.drive-list{display:flex;flex-direction:column;gap:12px}
.drive-row{display:grid;grid-template-columns:44px 1fr 120px 100px;align-items:center;gap:14px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.drive-letter{font:700 16px var(--mono)}
.drive-bar-wrap{min-width:0}
.drive-bar{height:10px;background:var(--track);border-radius:999px;overflow:hidden}
.drive-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--cyan));min-width:2px}
.drive-bar i.warn{background:linear-gradient(90deg,var(--orange),var(--red))}
.drive-info{font-size:12px;color:var(--muted);margin-top:4px}
.drive-size{font:13px var(--mono);text-align:right}.drive-reclaim{font:12px var(--mono);color:var(--green);text-align:right}

/* Rule toggles */
.rulebar{background:var(--app);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:20px 0;box-shadow:var(--shadow)}
.rulebar-title{font-size:14px;font-weight:700;margin-bottom:12px}
.rules{display:flex;flex-wrap:wrap;gap:10px}
.rule{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;user-select:none;transition:.15s}
.rule:hover{border-color:var(--blue)}
.rule.active{background:var(--blue-soft);border-color:var(--blue);color:#1557b0}
.rule input{accent-color:var(--blue)}

/* Panels */
.section{margin-bottom:22px}
.panel{background:var(--app);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.panel-head:hover{background:var(--soft)}
.panel-head .left{display:flex;align-items:center;gap:12px;min-width:0}
.panel-head .title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-head .stat{font:12px var(--mono);color:var(--muted);white-space:nowrap}
.panel-head .toggle{transition:.2s;color:var(--faint)}
.panel.open .toggle{transform:rotate(90deg)}
.panel-body{display:none;padding:12px 16px 16px}
.panel.open .panel-body{display:block}
.panel-summary{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.6}

/* Tables */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;min-width:760px;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
tr:hover td{background:#fafafa}
td.name{max-width:340px}
.file-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-path{font:11px var(--mono);color:var(--faint);margin-top:2px;word-break:break-all}
.size{font:13px var(--mono);white-space:nowrap}
.date{font:12px var(--mono);color:var(--muted);white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700}
.pill.green{background:var(--green-soft);color:#137333}.pill.orange{background:var(--orange-soft);color:#b06000}
.pill.yellow{background:var(--yellow-soft);color:#b45f06}.pill.red{background:var(--red-soft);color:#c5221f}
.pill.blue{background:var(--blue-soft);color:#1967d2}

/* Bulk actions */
.bulkbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:12px 16px;background:var(--soft);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
.bulkbar .left{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{border-color:var(--dark)}
.btn.primary{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.primary:hover{background:#000}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger:hover{background:#c5221f}
.btn:disabled{opacity:.45;cursor:not-allowed}
.selection-count{font:12px var(--mono);color:var(--muted)}

/* Status */
.status{font:12px var(--mono)}.status.ok{color:var(--green)}.status.err{color:var(--red)}.status.busy{color:var(--muted)}

/* Tabs */
.tabs{display:flex;gap:8px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.tab{border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.tab:hover{color:var(--ink);background:var(--soft)}
.tab.active{background:var(--blue-soft);color:var(--blue);border-color:var(--blue)}

/* Misc */
.empty{text-align:center;padding:40px;color:var(--faint);font-size:13px}
.checkbox{width:16px;height:16px;accent-color:var(--blue)}
.note{font-size:12px;color:var(--muted);background:var(--soft);border-left:3px solid var(--blue);padding:10px 12px;border-radius:0 var(--r) var(--r) 0;margin:10px 0}
.warning-note{border-left-color:var(--orange)}
.danger-note{border-left-color:var(--red)}

@media(max-width:900px){
  .app-shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .main{padding:16px}
}
</style>
</head>
<body>
<div class="app-shell">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">🧹</div><div><div class="brand-title">disk-cleaner-plus</div><div class="brand-sub">全盘智能清理</div></div></div>
  <nav class="nav">
    <button class="nav-link active" data-page="dashboard">📊 仪表盘</button>
    <button class="nav-link" data-page="installers">📦 安装包</button>
    <button class="nav-link" data-page="archives">📚 压缩包</button>
    <button class="nav-link" data-page="downloads">📁 下载文件</button>
    <button class="nav-link" data-page="duplicates">👥 重复文件</button>
    <button class="nav-link" data-page="cache">🛠️ 缓存/设置</button>
    <button class="nav-link" data-page="bigfiles">🎬 大文件</button>
  </nav>
</aside>
<main class="main">
  <div class="topbar"><div><h1 id="page-title">全盘空间仪表盘</h1><div class="meta" id="page-meta"></div></div><div class="status" id="global-status"></div></div>
  <div id="app"></div>
</main>
</div>

<script>
const DATA = __REPORT_DATA__;
const CONFIG = __DELETE_CONFIG__;
const TOKEN = CONFIG ? CONFIG.token : '';
const ENDPOINT = CONFIG ? CONFIG.endpoint : '';
let SELECTED = new Set();
let CURRENT_PAGE = 'dashboard';

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtGB = v => v>=1024?(v/1024).toFixed(2)+' TB':v.toFixed(2)+' GB';
const fmtSize = b => {
  const units=['B','KB','MB','GB','TB']; let n=parseFloat(b)||0;
  for(let u of units){ if(n<1024||u==='TB') return u==='B'||u==='KB'?Math.round(n)+' '+u:n.toFixed(2)+' '+u; n/=1024; }
  return b+' B';
};
const sumBytes = arr => arr.reduce((a,x)=>a+(x.size_bytes||0),0);
const setStatus = (msg, cls='busy') => { document.getElementById('global-status').className='status '+cls; document.getElementById('global-status').textContent=msg; };

function nav(page){
  CURRENT_PAGE=page;
  document.querySelectorAll('.nav-link').forEach(n=>n.classList.toggle('active', n.dataset.page===page));
  render(page);
}
document.querySelectorAll('.nav-link').forEach(n=>n.addEventListener('click',()=>nav(n.dataset.page)));

function render(page){
  const app=document.getElementById('app');
  if(page==='dashboard') app.innerHTML=renderDashboard();
  else if(page==='installers') app.innerHTML=renderInstallers();
  else if(page==='archives') app.innerHTML=renderArchives();
  else if(page==='downloads') app.innerHTML=renderDownloads();
  else if(page==='duplicates') app.innerHTML=renderDuplicates();
  else if(page==='cache') app.innerHTML=renderCache();
  else if(page==='bigfiles') app.innerHTML=renderBigFiles();
  attachHandlers();
  updateSelectionUI();
}

function renderDashboard(){
  const drives=DATA.drives||[];
  const summary=DATA.summary||{};
  const total=fmtGB(summary.total_reclaimable_gb||0);
  const c=drives.find(d=>d.letter==='C:\\')||{};
  const lowSpace=(c.free_pct||100)<15;
  return `
  <div class="grid cards-4">
    <div class="card"><div class="card-title">预计可清理</div><div class="card-value blue">${total}</div><div class="card-sub">按当前规则估算</div></div>
    <div class="card"><div class="card-title">冗余安装包</div><div class="card-value green">${fmtGB(summary.installers_redundant_gb||0)}</div><div class="card-sub">已安装软件的残留</div></div>
    <div class="card"><div class="card-title">超期下载</div><div class="card-value orange">${fmtGB(summary.downloads_old_gb||0)}</div><div class="card-sub">90天未使用</div></div>
    <div class="card"><div class="card-title">重复文件浪费</div><div class="card-value red">${fmtGB(summary.duplicates_wasted_gb||0)}</div><div class="card-sub">跨盘重复</div></div>
  </div>
  <div class="section" style="margin-top:22px">
    <h2>🖥️ 全盘空间状态</h2>
    <div class="drive-list">
      ${drives.map(d=>{
        const pct=Math.max(0,Math.min(100,100-(d.free_pct||0)));
        const warn=(d.free_pct||0)<15;
        return `<div class="drive-row">
          <div class="drive-letter">${esc(d.letter)}</div>
          <div class="drive-bar-wrap">
            <div class="drive-bar"><i style="width:${pct}%" class="${warn?'warn':''}"></i></div>
            <div class="drive-info">已用 ${fmtGB(d.used_gb||0)} / 总计 ${fmtGB(d.total_gb||0)} · 剩余 ${d.free_pct}%</div>
          </div>
          <div class="drive-size">${fmtGB(d.free_gb||0)} 可用</div>
          <div class="drive-reclaim">可清 ${fmtGB(d.reclaimable_gb||0)}</div>
        </div>`;
      }).join('')}
    </div>
  </div>
  <div class="section">
    <h2>⚡ 一键规则清理</h2>
    <div class="rulebar">
      <div class="rules">
        <label class="rule" id="rule-installers"><input type="checkbox"> 所有已安装软件的残留安装包</label>
        <label class="rule" id="rule-downloads"><input type="checkbox"> 90天以前的下载文件</label>
        <label class="rule" id="rule-archives"><input type="checkbox"> 180天未动的压缩包</label>
        <label class="rule" id="rule-duplicates"><input type="checkbox"> 跨盘重复文件（保留最新）</label>
      </div>
    </div>
    <div class="bulkbar"><div class="left"><button class="btn" id="btn-bulk-trash" disabled>🗑️ 移入回收站</button><button class="btn danger" id="btn-bulk-hard" disabled title="绕过回收站，不可恢复">⚡ 极速删除勾选项</button><span class="selection-count" id="selection-count">已选 0 项</span></div><button class="btn" id="btn-clear-selection">清空选择</button></div>
  </div>
  <div class="section">
    <div class="note">💡 所有删除操作只会移到 Windows 回收站，误删可随时还原。禁止触碰系统目录、Program Files、Docker/WSL 虚拟磁盘。</div>
    <div class="note danger-note">⚡ 极速删除 = 绕过回收站（rmdir /s /q 整目录暴风抹除 / 32 线程并发删除），<b>不可恢复</b>，仅用于确定是垃圾的缓存和残留安装包。</div>
  </div>`;
}

function fileRow(item, opts={}){
  const days=item.modified_days||0;
  const ageBadge = days>180?'<span class="pill red">>180天</span>':days>90?'<span class="pill orange">>90天</span>':days>30?'<span class="pill yellow">>30天</span>':'<span class="pill green">近期</span>';
  const match = item.matched_program ? `<div class="file-path">✅ 已匹配已安装软件: ${esc(item.matched_program)}</div>` : '';
  const checkbox = opts.checkbox!==false ? `<input type="checkbox" class="checkbox file-cb" data-path="${esc(item.path)}" ${SELECTED.has(item.path)?'checked':''}>` : '';
  const hardBtn = (CONFIG && CONFIG.hardDeleteEnabled && opts.hard!==false)
    ? `<button class="btn danger" data-hard="${esc(item.path)}" title="绕过回收站，不可恢复">⚡极速删</button>`
    : '';
  return `<tr>
    <td>${checkbox}</td>
    <td class="name"><div class="file-name" title="${esc(item.name)}">${esc(item.name)}</div><div class="file-path">${esc(item.path)}</div>${match}</td>
    <td class="size">${esc(item.size_h)}</td>
    <td class="date">${esc(item.modified)}<br>${ageBadge}</td>
    <td style="white-space:nowrap"><button class="btn" data-open="${esc(item.path)}">打开</button> ${hardBtn}</td>
  </tr>`;
}

function bulkBar(showHard=true){
  const hardBtn = (CONFIG && CONFIG.hardDeleteEnabled && showHard)
    ? `<button class="btn danger" id="btn-bulk-hard" disabled title="绕过回收站，不可恢复">⚡ 极速删除勾选项</button>`
    : '';
  return `<div class="bulkbar"><div class="left"><button class="btn" id="btn-bulk-trash" disabled>🗑️ 移入回收站</button>${hardBtn}<span class="selection-count" id="selection-count">已选 0 项</span></div><button class="btn" id="btn-clear-selection">清空选择</button></div>`;
}

function renderInstallers(){
  const cat=DATA.categories.installers||{};
  const items=cat.likely_redundant||[];
  return `
  <h2>📦 冗余安装包 <span class="pill green">建议清理</span></h2>
  <div class="panel-summary">共 ${cat.count||0} 个安装包，其中 <b>${items.length}</b> 个已匹配到系统中已安装的软件，可安全清理。占用约 ${fmtGB((cat.redundant_bytes||0)/1024/1024/1024)}。</div>
  ${bulkBar()}
  <div class="table-wrap"><table><thead><tr><th width="30"></th><th>文件名</th><th>大小</th><th>修改时间</th><th>操作</th></tr></thead><tbody>
    ${items.length?items.map(x=>fileRow(x)).join(''):'<tr><td colspan="5" class="empty">未发现冗余安装包</td></tr>'}
  </tbody></table></div>`;
}

function renderArchives(){
  const cat=DATA.categories.archives||{};
  const byAge=cat.by_age||{};
  return `
  <h2>📚 压缩包</h2>
  <div class="panel-summary">共 ${cat.count||0} 个压缩包。建议优先处理 180 天未动的压缩包。</div>
  <div class="tabs">
    <button class="tab active" data-tab="all">全部 (${cat.count||0})</button>
    <button class="tab" data-tab=">180">>180天 (${(byAge['>180']||[]).length})</button>
    <button class="tab" data-tab=">90">>90天 (${(byAge['>90']||[]).length})</button>
    <button class="tab" data-tab=">30">>30天 (${(byAge['>30']||[]).length})</button>
    <button class="tab" data-tab="recent">近期 (${(byAge['recent']||[]).length})</button>
  </div>
  ${bulkBar()}
  <div id="archive-tab-body">
    ${renderArchiveTable(byAge['all']=cat.all||[])}
  </div>`;
}
function renderArchiveTable(items){
  return `<div class="table-wrap"><table><thead><tr><th width="30"></th><th>文件名</th><th>大小</th><th>修改时间</th><th>操作</th></tr></thead><tbody>
    ${items.length?items.map(x=>fileRow(x)).join(''):'<tr><td colspan="5" class="empty">无压缩包</td></tr>'}
  </tbody></table></div>`;
}

function renderDownloads(){
  const cat=DATA.categories.downloads||{};
  const byAge=cat.by_age||{};
  return `
  <h2>📁 下载文件夹杂乱文件</h2>
  <div class="panel-summary">扫描 Downloads / 下载 目录中 >=50MB 的文件，按未使用时间分层。</div>
  <div class="tabs">
    <button class="tab active" data-tab="all">全部 (${cat.count||0})</button>
    <button class="tab" data-tab=">180">>180天 (${(byAge['>180']||[]).length})</button>
    <button class="tab" data-tab=">90">>90天 (${(byAge['>90']||[]).length})</button>
    <button class="tab" data-tab=">30">>30天 (${(byAge['>30']||[]).length})</button>
    <button class="tab" data-tab="recent">近期 (${(byAge['recent']||[]).length})</button>
  </div>
  ${bulkBar()}
  <div id="download-tab-body">${renderDownloadTable(cat.all||[])}</div>`;
}
function renderDownloadTable(items){
  return `<div class="table-wrap"><table><thead><tr><th width="30"></th><th>文件名</th><th>大小</th><th>修改时间</th><th>操作</th></tr></thead><tbody>
    ${items.length?items.map(x=>fileRow(x)).join(''):'<tr><td colspan="5" class="empty">无大文件</td></tr>'}
  </tbody></table></div>`;
}

function renderDuplicates(){
  const cat=DATA.categories.duplicates||{};
  const groups=cat.groups||[];
  return `
  <h2>👥 跨盘重复文件</h2>
  <div class="panel-summary">共 ${groups.length} 组重复文件，预计可释放 ${fmtGB((cat.wasted_bytes||0)/1024/1024/1024)}。每组自动保留最新一份，其余可清理。</div>
  ${bulkBar()}
  ${groups.map((g,i)=>`
    <div class="panel" style="margin-bottom:12px">
      <div class="panel-head" data-toggle>
        <div class="left"><span class="toggle">▶</span><span class="title">重复组 ${i+1}: ${esc(g.keep.name)}</span><span class="stat">${g.count} 个 · 浪费 ${esc(g.wasted_h)}</span></div>
      </div>
      <div class="panel-body">
        <div class="note">✅ 保留最新: ${esc(g.keep.path)} (${esc(g.keep.modified)})</div>
        <div class="table-wrap"><table><thead><tr><th width="30"></th><th>重复副本路径</th><th>大小</th><th>修改时间</th><th>操作</th></tr></thead><tbody>
          ${g.duplicates.map(d=>fileRow(d)).join('')}
        </tbody></table></div>
      </div>
    </div>
  `).join('')}`;
}

function renderCache(){
  const safe=DATA.categories.safe_cache||{};
  const change=DATA.categories.change_settings_first||{};
  const blocked=DATA.categories.do_not_touch||{};
  return `
  <h2>🛠️ 可清理缓存</h2>
  <div class="table-wrap"><table><thead><tr><th>目录</th><th>路径</th><th>大小</th><th>操作</th></tr></thead><tbody>
    ${(safe.items||[]).map(x=>`<tr><td>${esc(x.clean_label||x.name)}</td><td class="file-path">${esc(x.path)}</td><td class="size">${esc(x.size_h)}</td><td style="white-space:nowrap"><button class="btn" data-trash="${esc(x.path)}">🗑️移回收站</button> ${CONFIG&&CONFIG.hardDeleteEnabled?`<button class="btn danger" data-hard="${esc(x.path)}" title="绕过回收站，不可恢复">⚡极速删</button>`:''}</td></tr>`).join('')}
  </tbody></table></div>

  <h2 style="margin-top:24px">⚠️ 先改设置再迁移</h2>
  <div class="warning-note note">微信、QQ、OneDrive、conda、Docker、WSL 等不建议直接剪切。先在软件设置里改路径，再迁移历史文件。</div>
  <div class="table-wrap"><table><thead><tr><th>应用</th><th>路径</th><th>大小</th><th>建议</th></tr></thead><tbody>
    ${(change.items||[]).map(x=>`<tr><td>${esc(x.app||x.name)}</td><td class="file-path">${esc(x.path)}</td><td class="size">${esc(x.size_h)}</td><td><button class="btn" data-open="${esc(x.path)}">打开位置</button></td></tr>`).join('')}
  </tbody></table></div>

  <h2 style="margin-top:24px">🚫 禁止移动或删除</h2>
  <div class="danger-note note">Windows、Program Files、ProgramData、pagefile、hiberfil、WSL ext4.vhdx、Docker 虚拟磁盘等，不要手动操作。</div>
  <div class="table-wrap"><table><thead><tr><th>路径/类型</th></tr></thead><tbody>
    ${(blocked.paths||[]).map(p=>`<tr><td class="file-path">${esc(p)}</td></tr>`).join('')}
  </tbody></table></div>`;
}

function renderBigFiles(){
  const cat=DATA.categories.big_files||{};
  const items=cat.items||[];
  return `
  <h2>🎬 大文件榜</h2>
  <div class="panel-summary">全盘中 >=50MB 的单个大文件，仅定位，不参与自动清理，需你人工确认。</div>
  <div class="table-wrap"><table><thead><tr><th>文件名</th><th>类型</th><th>大小</th><th>修改时间</th><th>操作</th></tr></thead><tbody>
    ${items.length?items.map(x=>`<tr><td class="name"><div class="file-name">${esc(x.name)}</div><div class="file-path">${esc(x.path)}</div></td><td><span class="pill blue">${esc(x.kind||'other')}</span></td><td class="size">${esc(x.size_h)}</td><td class="date">${esc(x.modified)}</td><td><button class="btn" data-open="${esc(x.path)}">打开位置</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">未发现大文件</td></tr>'}
  </tbody></table></div>`;
}

function attachHandlers(){
  // 折叠面板
  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click',()=>{ el.closest('.panel').classList.toggle('open'); });
  });
  // 文件选择
  document.querySelectorAll('.file-cb').forEach(cb=>{
    cb.addEventListener('change',e=>{
      const p=cb.dataset.path;
      if(cb.checked) SELECTED.add(p); else SELECTED.delete(p);
      updateSelectionUI();
    });
  });
  // 打开位置
  document.querySelectorAll('[data-open]').forEach(btn=>{
    btn.addEventListener('click',()=>action('open',[btn.dataset.open]));
  });
  // 单个移回收站
  document.querySelectorAll('[data-trash]').forEach(btn=>{
    btn.addEventListener('click',()=>{ if(confirm('确定将该目录移入回收站？')) action('trash',[btn.dataset.trash]); });
  });
  // 单个极速删
  document.querySelectorAll('[data-hard]').forEach(btn=>{
    btn.addEventListener('click',()=>action('hard_delete',[btn.dataset.hard]));
  });
  // 批量操作
  const bulkTrash=document.getElementById('btn-bulk-trash');
  if(bulkTrash) bulkTrash.addEventListener('click',()=>{
    if(SELECTED.size===0) return;
    if(!confirm(`确定将 ${SELECTED.size} 项移入回收站？`)) return;
    action('trash', Array.from(SELECTED));
  });
  const bulkHard=document.getElementById('btn-bulk-hard');
  if(bulkHard) bulkHard.addEventListener('click',()=>{
    if(SELECTED.size===0) return;
    action('hard_delete', Array.from(SELECTED));
  });
  const clearBtn=document.getElementById('btn-clear-selection');
  if(clearBtn) clearBtn.addEventListener('click',()=>{ SELECTED.clear(); updateSelectionUI(); render(CURRENT_PAGE); });

  // 规则快捷勾选
  const applyRules=()=>{
    SELECTED.clear();
    if(document.querySelector('#rule-installers input')?.checked){
      (DATA.categories.installers.likely_redundant||[]).forEach(x=>SELECTED.add(x.path));
    }
    if(document.querySelector('#rule-downloads input')?.checked){
      ((DATA.categories.downloads.by_age||{})['>90']||[]).forEach(x=>SELECTED.add(x.path));
    }
    if(document.querySelector('#rule-archives input')?.checked){
      ((DATA.categories.archives.by_age||{})['>180']||[]).forEach(x=>SELECTED.add(x.path));
    }
    if(document.querySelector('#rule-duplicates input')?.checked){
      (DATA.categories.duplicates.groups||[]).forEach(g=>g.duplicates.forEach(d=>SELECTED.add(d.path)));
    }
    updateSelectionUI();
    render(CURRENT_PAGE);
  };
  document.querySelectorAll('.rule input').forEach(inp=>inp.addEventListener('change',applyRules));

  // 压缩包/下载 tab
  document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click',()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      const key=tab.dataset.tab;
      let items=[];
      if(CURRENT_PAGE==='archives'){
        const cat=DATA.categories.archives||{};
        items = key==='all'?(cat.all||[]):((cat.by_age||{})[key]||[]);
        document.getElementById('archive-tab-body').innerHTML=renderArchiveTable(items);
      }else if(CURRENT_PAGE==='downloads'){
        const cat=DATA.categories.downloads||{};
        items = key==='all'?(cat.all||[]):((cat.by_age||{})[key]||[]);
        document.getElementById('download-tab-body').innerHTML=renderDownloadTable(items);
      }
      attachHandlers();
    });
  });
}

function updateSelectionUI(){
  const countEl=document.getElementById('selection-count');
  const btn=document.getElementById('btn-bulk-trash');
  const hardBtn=document.getElementById('btn-bulk-hard');
  if(countEl) countEl.textContent=`已选 ${SELECTED.size} 项`;
  if(btn) btn.disabled=SELECTED.size===0;
  if(hardBtn) hardBtn.disabled=SELECTED.size===0;
}

async function action(mode, paths){
  if(!CONFIG){ setStatus('当前为静态报告，不支持操作','err'); return; }
  // 极速硬删需要二次确认（不可恢复）
  if(mode==='hard_delete'){
    const n=paths.length;
    const confirmed=confirm(`⚠️ 极速硬删 ${n} 项（绕过回收站，不可恢复！）\n\n确认要继续吗？\n建议：不确定的项请改用"移入回收站"。`);
    if(!confirmed){ setStatus('已取消','ok'); return; }
    const confirmed2=prompt(`这是最后确认。输入 DELETE 以永久删除 ${n} 项：`);
    if(confirmed2!=='DELETE'){ setStatus('已取消','ok'); return; }
  }
  setStatus(mode==='trash'?'正在移入回收站...':mode==='hard_delete'?'正在极速删除...':'正在打开...','busy');
  try{
    const res=await fetch(ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:TOKEN, mode, paths, confirm: mode==='hard_delete'})
    });
    const data=await res.json();
    if(data.ok){
      setStatus(mode==='trash'?`已移入回收站 ${data.done.length} 项`:mode==='hard_delete'?`⚡ 已极速删除 ${data.done.length} 项`:'已打开','ok');
      if(mode==='trash'||mode==='hard_delete'){
        data.done.forEach(p=>SELECTED.delete(p));
        updateSelectionUI();
        setTimeout(()=>render(CURRENT_PAGE),600);
      }
    }else{
      setStatus('失败: '+(data.error||(data.failed&&data.failed.length?data.failed[0].error:'未知')),'err');
    }
  }catch(e){
    setStatus('请求失败: '+e.message,'err');
  }
}

// 初始渲染
render('dashboard');
</script>

</html>
