interface:
  display_name: "Disk Cleaner Plus"
  short_description: "Windows 磁盘、垃圾软件与顽固残留深度清洁"
  default_prompt: "Use $disk-cleaner-plus to audit Windows disk usage and the software ecosystem first, protect work/user data, then clean only the scope I authorize."

policy:
  # v3 can uninstall software and perform irreversible hard deletion.
  # Require explicit invocation rather than silently triggering.
  allow_implicit_invocation: false
